name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            APP_DIR="${HOME}/masaqr"
            df -h
            sudo swapoff /swapfile 2>/dev/null || true
            sudo rm -f /swapfile
            mkdir -p "${APP_DIR}/prisma"
            for candidate in "${HOME}/prisma/dev.db" "${HOME}/dev.db" "${HOME}/MasaQR/prisma/dev.db" "${HOME}/MasaQR/dev.db"; do
              if [ -f "${candidate}" ]; then
                cp -a "${candidate}" "${APP_DIR}/prisma/dev.db"
                break
              fi
            done
            rm -rf "${HOME}/.npm/_cacache" "${APP_DIR}/node_modules" "${APP_DIR}/.next"
            rm -rf "${HOME}/MasaQR" "${HOME}/node_modules" "${HOME}/.next"
            sudo journalctl --vacuum-size=20M >/dev/null 2>&1 || true
            df -h
            if [ ! -d "${APP_DIR}/.git" ]; then
              git clone https://github.com/masaqrcloud/version001.git "${APP_DIR}"
            fi
            if [ ! -f "${APP_DIR}/.env" ] && [ -f "${HOME}/.env" ]; then
              cp "${HOME}/.env" "${APP_DIR}/.env"
            fi
            cd "${APP_DIR}"
            git fetch origin main
            git reset --hard origin/main
            bash deploy.sh
