name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            APP_DIR="${HOME}/masaqr"
            if [ ! -d "${APP_DIR}/.git" ]; then
              git clone https://github.com/masaqrcloud/version001.git "${APP_DIR}"
            fi
            if [ ! -f "${APP_DIR}/.env" ] && [ -f "${HOME}/.env" ]; then
              cp "${HOME}/.env" "${APP_DIR}/.env"
            fi
            cd "${APP_DIR}"
            bash deploy.sh
